<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {%- seo -%}
    <link rel="stylesheet" href="{{ '/assets/css/profile.css' | relative_url }}">
    {% if page.travel %}
    <link rel="stylesheet" href="{{ '/assets/css/travel.css' | relative_url }}">
    <script src="{{ '/assets/travel.js' | relative_url }}" defer></script>
    {% endif %}
    {%- feed_meta -%}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="profile-header">
      <div class="profile-container header-inner">
        <a class="profile-wordmark" href="{{ '/' | relative_url }}" rel="author">Yingchen Xu<span aria-hidden="true">.</span></a>
        <nav aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}#about">About</a>
          <a href="{{ '/' | relative_url }}#publications">Publications</a>
          {% if page.travel %}
          <a href="{{ '/travel.html' | relative_url }}" aria-current="page">Travel</a>
          {% endif %}
        </nav>
      </div>
    </header>
    <main class="profile-container" id="main-content">
      {{ content }}
    </main>
    <footer class="profile-footer profile-container">
      <span>Yingchen Xu</span>
      <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
      <a href="#main-content">Back to top <span aria-hidden="true">↑</span></a>
    </footer>
  </body>
</html>
